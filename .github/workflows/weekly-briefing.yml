name: 法律周报自动生成 (Legal Weekly Briefing)

on:
  schedule:
    - cron: '0 1 * * 3'   # 每周三 北京时间 9:00 (UTC 01:00)
    - cron: '0 1 * * 5'   # 每周五 北京时间 9:00 (UTC 01:00)
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# 避免同一次手动/调度触发的重叠运行
concurrency:
  group: legal-weekly-briefing
  cancel-in-progress: false

permissions:
  contents: write   # 用于将生成的周报提交回仓库

jobs:
  weekly-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pyyaml

      - name: 评分引擎自检 (verify.py)
        run: PYTHONPATH=scripts python3 scripts/verify.py

      - name: 生成法律周报
        id: briefing
        run: |
          # 若仓库中维护了 candidates.jsonl（手动或外部发现），跑完整流水线；
          # 否则回退到 Level 0 demo，保证每次调度都有产出。
          if [ -f candidates.jsonl ]; then
            echo "检测到 candidates.jsonl，运行完整评分流水线"
            PYTHONPATH=scripts python3 scripts/run_pipeline.py candidates.jsonl
          else
            echo "未检测到 candidates.jsonl，运行 demo 演示"
            python3 scripts/demo.py
          fi

      - name: 上传周报为 Artifact（可下载，避免污染 git 历史）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-briefing-report
          path: |
            周报_demo_*.md
            周报_demo_*.html
            demo_data_*.json
            run-report.json
            ima_import_queue.jsonl
          if-no-files-found: ignore
          retention-days: 30
