# IMA 知识库分类映射（按知识库路由版本，2026-07 修订）
#
# ⚠️ 重要：IMA 的 knowledge_base_id 有两套，切勿混用！
#   - kb_url_id：浏览器地址栏 URL 里的 knowledgeBaseId（纯数字串，仅供人工核对"这是哪个库"）
#   - knowledge_base_id：OpenAPI 接口真正要用的后端编码 ID（下面这串）
#   两者指向同一个库，但 OpenAPI 调用必须用 knowledge_base_id，用 kb_url_id 会报 220004 invalid。
#   本文件里 knowledge_base_id 已通过 get_addable_knowledge_base_list 实拉校验，确保可用。
#
# 路由模型：IMA 文件夹是前端视图，后端无 folder_id；每个领域 = 一个独立 knowledge_base_id。
# 文章命中某领域 → 导入对应 knowledge_base_id 的根目录（import_urls 省略 folder_id 即根目录）。
#
# 优先级与关键词：严格对齐作者原始设计（根提交 taxonomy.yaml + SKILL.md 分类规则表）。
#   - 婚姻家事 10 / 建筑工程·劳动法·交通事故 9 / 公司·合同借贷·房地产物权·侵权 8 / 刑事 7 / 管辖 6
#   - 执行、知识产权为作者原版没有的方向（用户新增），按作者梯度补：执行 9、知识产权 8
#   - 平局裁决：priority 高者为主类；并列时按列表顺序取前者

# 兜底库：无领域命中时放入此库（旧的单库"微信公众号推送文章"）
uncategorized_knowledge_base_id: "xYQ8k_2Hd88AMUF0ng95W3U_FBg37YmAsmla7ajjo4A="

